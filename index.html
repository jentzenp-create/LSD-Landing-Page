<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Sun Digital | Automate Your Google Reviews</title>

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://js.stripe.com">

  <!-- Google Fonts with display=swap for faster rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="root"></div>

  <!-- Main app script -->
  <script type="module" src="/index.tsx"></script>

  <!-- Stripe loaded lazily after page interaction or delay -->
  <script>
    // Lazy load Stripe only when needed or after page is interactive
    var stripeLoaded = false;
    function loadStripe() {
      if (stripeLoaded) return;
      stripeLoaded = true;
      var script = document.createElement('script');
      script.src = 'https://js.stripe.com/v3/';
      script.async = true;
      document.head.appendChild(script);
    }

    // Load after 3 seconds or on user interaction, whichever comes first
    setTimeout(loadStripe, 3000);
    ['click', 'scroll', 'touchstart'].forEach(function (event) {
      document.addEventListener(event, loadStripe, { once: true, passive: true });
    });
  </script>
</body>

</html>
