<html lang="en">

<head>

  <script src="https://cdn.tailwindcss.com"></script>

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F2B705',
            charcoal: '#1C1C1C',
            warmGray: '#E6E6E6',
            offWhite: '#F9F9F9',

      }

      background: #F2B705;
