<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2B705" />
  <title>Local Sun Digital | Automate Your Google Reviews</title>

  <!-- DNS prefetch and preconnect for Stripe (loaded lazily) -->
  <link rel="preconnect" href="https://js.stripe.com">
  <link rel="dns-prefetch" href="https://js.stripe.com">

  <!-- Critical inline CSS for instant first paint -->
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #fff;
      color: #000;
      margin: 0;
    }

    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #fff, #F9F9F9);
    }

    #root:empty::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid #F2B705;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Main app script -->
  <script type="module" src="/index.tsx"></script>

  <!-- Stripe loaded lazily after page interaction or delay -->
  <script>
    var stripeLoaded = false;
    function loadStripe() {
      if (stripeLoaded) return;
      stripeLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://js.stripe.com/v3/';
      s.async = true;
      document.head.appendChild(s);
    }
    setTimeout(loadStripe, 3000);
    ['click', 'scroll', 'touchstart'].forEach(function (e) {
      document.addEventListener(e, loadStripe, { once: true, passive: true });
    });
  </script>
</body>

</html>
